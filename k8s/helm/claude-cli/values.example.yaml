# claude-cli values. Required: auth.authorizedKeys (or auth.existingSecret).

image:
  repository: adambajger/claude-cli-cloud-run
  tag: "latest"
  pullPolicy: Always    # :latest tag → always pull new pushes

auth:
  # Pre-made Secret (SOPS/sealed-secrets/ESO); set → chart creates none. Keys: AUTHORIZED_KEYS, credentials.json?, GH_TOKEN?, HF_TOKEN?, YT_TOKEN?
  existingSecret: ""

  # Below = plaintext fallback; only for testing or encrypted values file.
  # SSH pubkeys for user `claude`: list (one per item) or multi-line string; merged+deduped into authorized_keys on start.
  authorizedKeys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP7NHRZqsXu7qCGYj9lAPUdJnA4Ts2XjprYO/9PBtAWY adamb@xiaomi-redmi-note-11s5g
    # - ssh-ed25519 ANOTHER_KEY jane.doe@example.com
  # Host ~/.claude/.credentials.json contents; seeded to PVC on first start or when this value changes, then CLI owns it.
  credentialsJson: |-
    {"copy your full":".claude/.credentials.json content here"}}
  ghToken: "gho_op..."           # optional GH_TOKEN
  hfToken: "hf_..."              # optional HF_TOKEN (HuggingFace)
  ytToken: ""                    # optional YouTrack token (perm-...); pair with youtrack.host

# One LB + one FQDN: 22→sshd, 80/443→caddy (own auto-TLS, no Ingress/cert-manager); ExternalDNS A+AAAA from host.
public:
  enabled: true             # false = no Service; reach pod via kubectl exec/port-forward
  host: claude-bajger.dyn.cloud.e-infra.cz   # single source for DNS, TLS, caddy vhost, SSH ("" = none)
  type: LoadBalancer        # LoadBalancer | NodePort | ClusterIP
  dualStack: true           # request IPv4 + IPv6
  sourceRanges: []          # allowlist for ALL ports; list both v4 + v6 CIDRs
  ssh:
    enabled: true           # expose SSH
    port: 22                # LB port → in-pod 2222
  web:
    enabled: true           # expose 80 + 443 → caddy
    email: ""               # ACME email ("" = anonymous)
    staging: false          # true = LE staging (untrusted certs, no rate limit)

persistence:
  size: 20Gi
  storageClass: ""      # "" = cluster default

resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits:   { cpu: "2",  memory: 8Gi }

shmSize: ""             # memory-backed /dev/shm size, counts vs limits.memory ("" = 64Mi default)

youtrack:
  host: ""                 # e.g. https://youtrack.yourco.com; MCP on only if host + auth.ytToken set

# Slack: account-level claude.ai connector; slack-monitor tools + skill always baked, no toggle.

claude:
  autoStartTmux:
    enabled: true           # run claude in detached tmux on start
    tmuxSessionName: "claude"   # attach: tmux attach -t <name>
    # Named RC session → fresh cloud session each pod (unnamed reattaches to old one).
    claudeCommand: "claude --remote-control \"My Orchestrator\" --dangerously-skip-permissions"

# GPU (mirrors resolve_gpu()). Whole GPU → nvidia.com/gpu limit + gpu.product nodeSelector; MIG → nvidia.com/<mig> limit only.
# Products: https://grafana.rationai.cloud.trusted.e-infra.cz/d/b755d03d-d664-486a-8fda-34c59377bf2d
# gpu:
#   type: "A100"          # A100 | A40 | H100 | Tesla P100 | mig-1g.10gb | mig-2g.20gb
#   count: 1              # all on one node
